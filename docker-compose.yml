name: grpc-rest-solution

services:
  grpcserviceclient:
    image: ${DOCKER_REGISTRY-}grpcserviceclient
    build:
      context: .
      dockerfile: GrpcServiceClient/Dockerfile

  restserviceclient:
    image: ${DOCKER_REGISTRY-}restserviceclient
    build:
      context: .
      dockerfile: RestServiceClient/Dockerfile

  grafana:
    image: grafana/grafana